name: Android CI

on:
  push:
    branches: [ Rexo-Kotlin, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        java -version
        which java

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create google-services.json
      run: |
        cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "621816896534",
            "project_id": "rexowallet2026",
            "storage_bucket": "rexowallet2026.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:621816896534:android:6bfc099c9685f8f2d8e937",
                "android_client_info": {
                  "package_name": "com.rexo.marketplace"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyD_EXy40wTJQKRJX-HS1YzeH1pC6Oo1Pak"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
        echo "SUPABASE_ANON_KEY=placeholder-key" >> local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        export JAVA_HOME=$JAVA_HOME
        export ANDROID_HOME=$ANDROID_HOME
        echo "Building with:"
        echo "JAVA_HOME=$JAVA_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME"
        ./gradlew assembleDebug --stacktrace --no-daemon --info
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
