name: Android CI

on:
  push:
    branches: [ Rexo-Kotlin, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create google-services.json
      run: |
        cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "621816896534",
            "project_id": "rexowallet2026",
            "storage_bucket": "rexowallet2026.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:621816896534:android:6bfc099c9685f8f2d8e937",
                "android_client_info": {
                  "package_name": "com.rexo.marketplace"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyD_EXy40wTJQKRJX-HS1YzeH1pC6Oo1Pak"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      run: |
        # Use GitHub Actions pre-installed Gradle if gradlew fails
        ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-apk
        path: app/build/outputs/apk/debug/*.apk
