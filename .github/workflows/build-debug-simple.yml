name: Build Debug APK (Simple)

on:
  push:
    branches:
      - Rexo-Kotlin
  workflow_dispatch:

jobs:
  build-debug:
    name: 🏗️ Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          echo "✅ local.properties created"

      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF
            echo "✅ google-services.json created from secret"
          else
            echo "⚠️  GOOGLE_SERVICES_JSON secret not set, using template"
            cp app/google-services.json.template app/google-services.json
          fi

      - name: 🔨 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace
          echo "✅ Debug APK built successfully"

      - name: 📝 Rename APK
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p output
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
               "output/Rexo-Marketplace-debug-${COMMIT_SHA}.apk"
            echo "✅ APK renamed"
          else
            echo "❌ APK not found!"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: output/*.apk
          retention-days: 7

      - name: 📊 APK Info
        run: |
          APK_FILE=$(find output -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "### 📱 Debug APK Built Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| File | \`$(basename $APK_FILE)\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Size | $(du -h $APK_FILE | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Build Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f local.properties
          rm -f app/google-services.json
          echo "✅ Cleanup completed"
