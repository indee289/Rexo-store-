name: Flutter Build

on:
  push:
    branches: [Rexo-Kotlin, Rexo-Kotlin-ui-refresh, main]
  pull_request:
    branches: [Rexo-Kotlin, main]
  workflow_dispatch:

# The build only needs to read repository contents. Signing/runtime secrets are
# referenced by name and are never printed or uploaded.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          cd admin_app && flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze --no-pub lib/
        continue-on-error: true

      - name: Validate and decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.REXO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.REXO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.REXO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.REXO_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/campster-upload-keystore.jks
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android signing secret $name is missing."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || {
            echo "::error::Decoded keystore is empty."
            exit 1
          }

          # Prove that the configured password and alias open this keystore.
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated."

      - name: Configure production Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is required for the production AAB."
            exit 1
          fi

          # Accept raw JSON or base64 without printing any configuration value.
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ['GOOGLE_SERVICES_JSON'].strip()
          try:
              text = raw if raw.startswith('{') else base64.b64decode(raw, validate=True).decode('utf-8')
              data = json.loads(text)
          except Exception as exc:
              raise SystemExit(f'Invalid GOOGLE_SERVICES_JSON secret: {exc}')

          clients = data.get('client') or []
          packages = {
              client.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for client in clients
          }
          project_number = str(data.get('project_info', {}).get('project_number', ''))
          if 'com.rexo.marketplace' not in packages:
              raise SystemExit('google-services.json has no com.rexo.marketplace client')
          if not project_number or set(project_number) == {'0'}:
              raise SystemExit('google-services.json still contains the placeholder Firebase project')

          Path('android/app/google-services.json').write_text(text, encoding='utf-8')
          print('Production Firebase configuration validated.')
          PY

      - name: Validate production runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY R2_ACCESS_KEY_ID \
                      R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME \
                      R2_PUBLIC_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production secret $name is missing."
              exit 1
            fi
          done
          [[ "$SUPABASE_URL" == https://* ]] || {
            echo "::error::SUPABASE_URL must use HTTPS."
            exit 1
          }
          [[ "$R2_PUBLIC_URL" == https://* ]] || {
            echo "::error::R2_PUBLIC_URL must use HTTPS."
            exit 1
          }
          echo "Production runtime configuration validated."

      - name: Build signed release APK and AAB
        env:
          REXO_KEYSTORE_PATH: ${{ runner.temp }}/campster-upload-keystore.jks
          REXO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.REXO_KEYSTORE_PASSWORD }}
          REXO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.REXO_KEY_ALIAS }}
          REXO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.REXO_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          set -euo pipefail

          # GitHub run numbers increase for every workflow run. The offset keeps
          # this release above the old pubspec versionCode 1 and prevents future
          # Play uploads from accidentally reusing a version code.
          CAMPSTER_BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          echo "CAMPSTER_BUILD_NUMBER=$CAMPSTER_BUILD_NUMBER" >> "$GITHUB_ENV"

          DEFINES=(
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            --dart-define=R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            --dart-define=R2_ACCOUNT_ID="$R2_ACCOUNT_ID"
            --dart-define=R2_BUCKET_NAME="$R2_BUCKET_NAME"
            --dart-define=R2_PUBLIC_URL="$R2_PUBLIC_URL"
          )
          if [ -n "$ONESIGNAL_APP_ID" ]; then
            DEFINES+=(--dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID")
          fi

          flutter build apk --release \
            --build-number="$CAMPSTER_BUILD_NUMBER" "${DEFINES[@]}"
          flutter build appbundle --release \
            --build-number="$CAMPSTER_BUILD_NUMBER" "${DEFINES[@]}"

      - name: Verify Play release artifact
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/campster-upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.REXO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.REXO_KEY_ALIAS }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$AAB" || { echo "::error::Release AAB is missing."; exit 1; }
          test -s "$APK" || { echo "::error::Release APK is missing."; exit 1; }

          # jarsigner must succeed; do not hide its exit code or stderr.
          if ! VERIFY_OUT=$(jarsigner -verify -verbose -certs "$AAB" 2>&1); then
            printf '%s\n' "$VERIFY_OUT"
            echo "::error::AAB signature verification failed."
            exit 1
          fi
          [[ "$VERIFY_OUT" == *"jar verified"* ]] || {
            echo "::error::jarsigner did not confirm a verified AAB."
            exit 1
          }
          if [[ "${VERIFY_OUT,,}" == *"cn=android debug"* ]]; then
            echo "::error::AAB is signed with the Android debug certificate."
            exit 1
          fi

          fingerprint_from_keytool() {
            awk '/SHA256:/{sub(/.*SHA256:[[:space:]]*/, ""); print; exit}' \
              | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }
          KEYSTORE_OUT=$(keytool -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")
          AAB_OUT=$(keytool -J-Duser.language=en -J-Duser.country=US \
            -printcert -jarfile "$AAB")
          KEYSTORE_SHA=$(printf '%s\n' "$KEYSTORE_OUT" | fingerprint_from_keytool)
          AAB_SHA=$(printf '%s\n' "$AAB_OUT" | fingerprint_from_keytool)
          test -n "$KEYSTORE_SHA" && test -n "$AAB_SHA" || {
            echo "::error::Could not read signing certificate fingerprints."
            exit 1
          }
          [ "$KEYSTORE_SHA" = "$AAB_SHA" ] || {
            echo "::error::AAB signer does not match the configured upload keystore."
            exit 1
          }

          # Optional: set ANDROID_UPLOAD_CERT_SHA256 to the fingerprint shown in
          # Play Console > App integrity for a full upload-key identity check.
          if [ -n "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            EXPECTED=$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" \
              | sed -E 's/^[[:space:]]*SHA-?256[[:space:]]*:[[:space:]]*//I' \
              | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
            [ "$KEYSTORE_SHA" = "$EXPECTED" ] || {
              echo "::error::Keystore does not match ANDROID_UPLOAD_CERT_SHA256."
              exit 1
            }
          fi

          # Check the final merged APK, not merely source Gradle values.
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt \
            | sort -V | tail -n 1)
          test -x "$AAPT" || { echo "::error::aapt not found."; exit 1; }
          BADGING=$("$AAPT" dump badging "$APK")
          [[ "$BADGING" == *"sdkVersion:'24'"* ]] || {
            echo "::error::Built APK minSdk is not 24."
            exit 1
          }
          [[ "$BADGING" == *"targetSdkVersion:'36'"* ]] || {
            echo "::error::Built APK targetSdk is not 36."
            exit 1
          }

          # Google Play requires 64-bit support and 16 KB page-aligned native
          # library packaging for apps targeting modern Android versions.
          AAB_ENTRIES=$(unzip -Z1 "$AAB")
          [[ "$AAB_ENTRIES" == *"base/lib/arm64-v8a/"* ]] || {
            echo "::error::AAB has no arm64-v8a native libraries."
            exit 1
          }
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign \
            | sort -V | tail -n 1)
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found."; exit 1; }
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/tmp/campster-zipalign.txt || {
            cat /tmp/campster-zipalign.txt
            echo "::error::APK failed 16 KB zip-alignment verification."
            exit 1
          }

          # Compressed/extracted JNI packaging avoids the affected-device loader
          # regression. Independently verify every arm64 ELF LOAD segment still
          # has at least 16 KB alignment, which is the actual runtime requirement.
          command -v readelf >/dev/null || {
            echo "::error::readelf not found."
            exit 1
          }
          ELF_DIR=$(mktemp -d)
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$ELF_DIR"
          ELF_COUNT=0
          while IFS= read -r -d '' SO_FILE; do
            ((ELF_COUNT += 1))
            while read -r ALIGN; do
              if (( ALIGN < 0x4000 )); then
                echo "::error::$(basename "$SO_FILE") has incompatible LOAD alignment $ALIGN."
                exit 1
              fi
            done < <(readelf -lW "$SO_FILE" | awk '/ LOAD / {print $NF}')
          done < <(find "$ELF_DIR/lib/arm64-v8a" -type f -name '*.so' -print0)
          (( ELF_COUNT > 0 )) || {
            echo "::error::No arm64 native libraries found for ELF verification."
            exit 1
          }
          rm -rf "$ELF_DIR"

          cat > build/app/outputs/bundle/release/release-info.txt <<EOF
          app=Campster
          applicationId=com.rexo.marketplace
          versionName=1.0.2
          versionCode=$CAMPSTER_BUILD_NUMBER
          minSdk=24
          targetSdk=36
          signerSha256=$KEYSTORE_SHA
          signatureVerified=true
          arm64Verified=true
          zipAlignment16KbVerified=true
          elfPageAlignment16KbVerified=true
          EOF
          echo "AAB verified: signed with configured keystore, minSdk 24, targetSdk 36, arm64 and 16 KB ELF alignment."

      - name: Give release files clear names
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Campster.apk
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/Campster.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campster
          path: build/app/outputs/flutter-apk/Campster.apk
          retention-days: 30

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campster-release-aab
          path: |
            build/app/outputs/bundle/release/Campster.aab
            build/app/outputs/bundle/release/release-info.txt
          retention-days: 30
