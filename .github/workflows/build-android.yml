name: Android Release Build & GitHub Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Package Lockfile Synchronization
        run: |
          echo "Checking package-lock.json synchronization with package.json..."
          if ! npm ci --dry-run >/dev/null 2>&1; then
            echo "::error::CRITICAL ERROR: package-lock.json is OUT OF SYNC with package.json!"
            echo "::error::Please run 'npm install' locally, commit BOTH package.json and package-lock.json, and push again."
            exit 1
          fi
          echo "LOCKFILE VERIFIED: package-lock.json is fully in sync with package.json."

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Workspace Diagnostics & Wallet Files
        run: |
          pwd
          git rev-parse HEAD || true
          ls -la src/components/wallet/
          test -f src/components/wallet/WalletCard.tsx || (echo "ERROR: WalletCard.tsx does not exist!" && exit 1)

      - name: Build Web Frontend Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Ensure Capacitor Android Platform & Sync Assets
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing. Initializing fresh Capacitor Android platform..."
            mkdir -p /tmp/android_backup
            if [ -f "android/app/google-services.json" ]; then
              cp android/app/google-services.json /tmp/android_backup/
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/android_backup/google-services.json" ]; then
              cp /tmp/android_backup/google-services.json android/app/google-services.json
            fi
          fi
          echo "Syncing web assets to Capacitor Android project..."
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate & Regenerate Gradle Wrapper JAR
        run: |
          echo "Checking gradle-wrapper.jar validity..."
          if ! java -jar android/gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "WARNING: android/gradle/wrapper/gradle-wrapper.jar is corrupt or invalid!"
            echo "Re-generating fresh Capacitor Android native project..."
            mkdir -p /tmp/android_backup
            if [ -f "android/app/google-services.json" ]; then
              cp android/app/google-services.json /tmp/android_backup/
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/android_backup/google-services.json" ]; then
              cp /tmp/android_backup/google-services.json android/app/google-services.json
            fi
            npx cap sync android
          fi
          echo "Verified Gradle Wrapper JAR:"
          java -jar android/gradle/wrapper/gradle-wrapper.jar --version

      - name: Generate Android App Launcher Icons
        run: node scripts/generate-android-icons.js

      - name: Decode Android Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore file created at android/app/release.keystore with size: $(stat -c%s android/app/release.keystore 2>/dev/null || stat -f%z android/app/release.keystore 2>/dev/null || echo 'unknown') bytes"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing or empty!"
            echo "NO_KEYSTORE" > android/app/release.keystore
          fi

      - name: Ensure Release Signing Config Is Present in build.gradle
        run: |
          python3 << 'EOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          if "signingConfigs" not in content:
              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
              content = content.replace("android {", "android {" + signing_block, 1)
              print("Inserted new signingConfigs block.")
          else:
              print("signingConfigs block already present, leaving as is.")

          if "signingConfig signingConfigs.release" not in content:
              new_content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content,
                  count=1
              )
              if new_content == content:
                  print("WARNING: could not find 'buildTypes { release {' pattern to inject signingConfig line!")
              content = new_content
          else:
              print("release buildType already references signingConfigs.release.")

          with open(path, "w") as f:
              f.write(content)
          EOF
          echo "----- Resulting signingConfigs block -----"
          grep -A 8 "signingConfigs" android/app/build.gradle || echo "ERROR: no signingConfigs block found!"
          echo "----- Resulting release buildType block -----"
          grep -A 6 "release {" android/app/build.gradle

      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Keystore file exists (app/release.keystore): $(test -f app/release.keystore && echo YES || echo NO)"
          echo "Keystore password set: ${ANDROID_KEYSTORE_PASSWORD:+YES}${ANDROID_KEYSTORE_PASSWORD:-NO}"
          echo "Key alias set: ${ANDROID_KEY_ALIAS:+YES}${ANDROID_KEY_ALIAS:-NO}"
          echo "Key password set: ${ANDROID_KEY_PASSWORD:+YES}${ANDROID_KEY_PASSWORD:-NO}"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Prepare Release Asset File
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          mkdir -p release-output
          echo "Locating built APK files in android/app/build/outputs/apk/..."
          APK_FILE=$(find android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No .apk file found under android/app/build/outputs/apk/!"
            exit 1
          fi
          echo "Found APK file at: $APK_FILE"
          DEST_NAME="Rexo-Influencer-Marketplace-v${VERSION}-release.apk"
          cp "$APK_FILE" "release-output/$DEST_NAME"
          echo "Successfully prepared asset: release-output/$DEST_NAME"

      - name: Verify APK Signature with apksigner
        run: |
          echo "Finding apksigner tool in Android SDK..."
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tool not found in Android SDK!"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"
          APK_FILE=$(find release-output/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No .apk file found in release-output/!"
            exit 1
          fi
          echo "Verifying signature for $APK_FILE..."
          $APKSIGNER verify --verbose "$APK_FILE"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name || '1.0.0' }}
          name: Rexo Marketplace v${{ github.event.inputs.version_name || '1.0.0' }}
          body: |
            ### 🚀 Rexo Influencer Marketplace Production Release
            - **Version**: v${{ github.event.inputs.version_name || '1.0.0' }}
            - **Commit**: `${{ github.sha }}`
            - **Security Status**: Fully Audited — All R2 storage, Gemini AI, Payment, & FCM secrets isolated to Supabase Edge Functions.
            - **APK Asset**: `Rexo-Influencer-Marketplace-v${{ github.event.inputs.version_name || '1.0.0' }}-release.apk`
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
