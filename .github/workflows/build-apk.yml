name: 🚀 Build Rexo APK

on:
  push:
    branches:
      - Rexo-Kotlin
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Create google-services.json (CRITICAL - Before any Gradle task!)
      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          echo '{
            "project_info": {
              "project_number": "621816896534",
              "project_id": "rexowallet2026",
              "storage_bucket": "rexowallet2026.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:621816896534:android:6bfc099c9685f8f2d8e937",
                  "android_client_info": {
                    "package_name": "com.rexo.marketplace"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyD_EXy40wTJQKRJX-HS1YzeH1pC6Oo1Pak"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json
          echo "✅ google-services.json created with REAL Firebase config"
          ls -la app/google-services.json
          cat app/google-services.json

      # Step 3: Validate google-services.json
      - name: ✅ Validate google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "❌ ERROR: google-services.json not found!"
            exit 1
          fi
          echo "✅ google-services.json exists"
          echo "📄 File size: $(stat -f%z app/google-services.json 2>/dev/null || stat -c%s app/google-services.json)"
          echo "📋 File content preview:"
          head -5 app/google-services.json

      # Step 4: Setup Java
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 4: Setup Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Step 5: Install NDK
      - name: 🔧 Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "✅ NDK installed"

      # Step 6: Create local.properties
      - name: 📝 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EOF
          echo "✅ local.properties created"

      # Step 8: Setup Gradle
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Step 9: Gradle Cache
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 10: Build Debug APK
      - name: 🏗️ Build Debug APK
        run: |
          echo "🔨 Building Debug APK..."
          # Use gradle command directly (setup-gradle provides it)
          gradle assembleDebug --stacktrace --no-daemon --max-workers=2 || \
          ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=2
          echo "✅ Debug APK built successfully!"
        timeout-minutes: 20

      # Step 11: Rename & Organize APK
      - name: 📦 Package APK
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p output
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
               "output/Rexo-debug-${COMMIT_SHA}.apk"
            ls -lh output/
            echo "✅ APK packaged!"
          else
            echo "❌ APK not found!"
            find app/build/outputs -name "*.apk"
            exit 1
          fi

      # Step 12: Upload APK
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rexo-APK-${{ github.sha }}
          path: output/*.apk
          retention-days: 30

      # Step 13: Summary
      - name: 📊 Build Summary
        run: |
          APK_FILE=$(find output -name "*.apk" | head -n 1)
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          
          echo "### 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 APK | \`$(basename $APK_FILE)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Size | **${APK_SIZE}** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Download from **Artifacts** section above" >> $GITHUB_STEP_SUMMARY
