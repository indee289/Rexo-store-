name: CI/CD - Continuous Integration

on:
  push:
    branches:
      - Rexo-Kotlin
      - main
      - develop
  pull_request:
    branches:
      - Rexo-Kotlin
      - main

jobs:
  # ============================================
  # JOB 1: Code Quality Checks
  # ============================================
  code-quality:
    name: 🔍 Code Quality & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔐 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: 🔨 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🔍 Run Lint Checks
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: 📊 Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ============================================
  # JOB 2: Unit Tests
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔐 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: 🔨 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew test --stacktrace
        continue-on-error: true

      - name: 📊 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ============================================
  # JOB 3: Build Debug APK
  # ============================================
  build-debug:
    name: 🏗️ Build Debug APK
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: 🔐 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: 🔨 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📝 Rename APK
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
             "output/Rexo-Marketplace-debug-${COMMIT_SHA}.apk"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: output/*.apk
          retention-days: 7

      - name: 📊 APK Info
        run: |
          APK_FILE=$(find output -name "*.apk" | head -n 1)
          echo "### 📱 APK Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`$(basename $APK_FILE)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $(du -h $APK_FILE | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 4: Dependency Analysis
  # ============================================
  dependency-check:
    name: 🔐 Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔐 Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: 🔥 Create google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: 🔨 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🔍 Check Dependencies
        run: ./gradlew dependencies --configuration debugRuntimeClasspath
        continue-on-error: true

  # ============================================
  # JOB 5: Build Status Notification
  # ============================================
  build-status:
    name: 📢 Build Status
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build-debug, dependency-check]
    if: always()
    
    steps:
      - name: 📊 Build Summary
        run: |
          echo "## 🎯 CI/CD Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
