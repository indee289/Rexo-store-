name: Deploy Supabase Edge Functions

# Edge deployments are intentionally manual. App/UI pushes must not fail because
# a Supabase personal access token lacks function-secret administration scopes.
on:
  workflow_dispatch:
    inputs:
      update_fcm_secrets:
        description: 'Update FCM secrets before deploying (requires edge_functions_secrets_write)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # Public project reference confirmed by the project owner.
      PROJECT_REF: rbdswysknhzepawseott

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is not configured."
            exit 1
          fi
          EXPECTED_URL="https://${PROJECT_REF}.supabase.co"
          if [ "${SUPABASE_URL%/}" != "$EXPECTED_URL" ]; then
            echo "::error::SUPABASE_URL does not match PROJECT_REF $PROJECT_REF."
            exit 1
          fi
          echo "Supabase project reference and URL match."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Existing function secrets do not need to be rewritten for every code
      # deployment. Enable this input only after giving the Supabase token the
      # edge_functions_secrets_write permission.
      - name: Update Edge Function FCM secrets
        if: ${{ inputs.update_fcm_secrets }}
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in FCM_PROJECT_ID FCM_CLIENT_EMAIL FCM_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is missing."
              exit 1
            fi
          done
          FCM_PRIVATE_KEY_B64=$(printf '%s' "$FCM_PRIVATE_KEY" | base64 -w 0)
          supabase secrets set \
            FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            FCM_CLIENT_EMAIL="$FCM_CLIENT_EMAIL" \
            FCM_PRIVATE_KEY_B64="$FCM_PRIVATE_KEY_B64" \
            --project-ref "$PROJECT_REF"

      # Use Supabase's server-side bundler. The gateway JWT check remains
      # enabled, and both functions also perform their own caller validation.
      - name: Deploy send-broadcast function
        run: |
          supabase functions deploy send-broadcast \
            --project-ref "$PROJECT_REF" \
            --use-api

      - name: Deploy delete-account function
        run: |
          supabase functions deploy delete-account \
            --project-ref "$PROJECT_REF" \
            --use-api
