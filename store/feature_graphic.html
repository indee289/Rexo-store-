<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024,initial-scale=1">
<title>Campster Play feature graphic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1024px;height:500px;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#0f1226;color:#fff}.canvas{position:relative;width:1024px;height:500px;display:grid;grid-template-columns:60% 40%;overflow:hidden}.canvas:after{content:"";position:absolute;inset:auto 0 0;height:8px;background:#0095f6}.left{padding:64px 0 54px 72px;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:20px}.mark{width:94px;height:94px;border-radius:24px;background:#0095f6;display:grid;place-items:center;font-size:62px;line-height:1;font-weight:900}.wordmark{font-size:58px;line-height:1;font-weight:850;letter-spacing:-2px}.tagline{margin-top:10px;color:#b8bed8;font-size:27px;font-weight:600}.headline{margin:51px 0 28px;font-size:38px;line-height:1.2;font-weight:800;letter-spacing:-.8px}.pills{display:flex;gap:13px}.pill{height:47px;padding:0 20px;border:2px solid #0095f6;border-radius:24px;display:flex;align-items:center;font-size:21px;font-weight:700;color:#f0ede5}.right{position:relative;background:#1a1e3b;padding:89px 40px 0 55px}.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:#0095f6;opacity:.08;filter:blur(10px);right:-100px;top:-120px}.card{height:92px;margin-bottom:17px;border-radius:18px;background:#24294e;display:flex;align-items:center;padding:20px;gap:16px;border:1px solid rgba(255,255,255,.03)}.avatar{width:48px;height:48px;border-radius:50%;background:#0095f6;flex:none}.lines{flex:1}.line{height:15px;border-radius:8px;background:#59628f}.line:first-child{width:64%;margin-bottom:13px}.line:last-child{width:92%;height:11px;background:#3d456f}.spark{position:absolute;width:13px;height:13px;border-radius:50%;background:#fcb045}.s1{right:46px;top:58px}.s2{left:26px;bottom:56px;width:8px;height:8px;background:#ed4956}
</style>
</head>
<body>
<div class="canvas">
  <section class="left">
    <div class="brand">
      <div class="mark">C</div>
      <div><div class="wordmark">Campster</div><div class="tagline">Creator &amp; brand marketplace</div></div>
    </div>
    <div class="headline">Discover campaigns.<br>Collaborate. Grow.</div>
    <div class="pills"><div class="pill">Campaigns</div><div class="pill">Creators</div><div class="pill">Messages</div></div>
  </section>
  <section class="right">
    <div class="glow"></div><i class="spark s1"></i><i class="spark s2"></i>
    <div class="card"><div class="avatar"></div><div class="lines"><div class="line"></div><div class="line"></div></div></div>
    <div class="card"><div class="avatar"></div><div class="lines"><div class="line"></div><div class="line"></div></div></div>
    <div class="card"><div class="avatar"></div><div class="lines"><div class="line"></div><div class="line"></div></div></div>
  </section>
</div>
</body>
</html>
