# ============================================================
# PostgreSQL Exporter Custom Queries for Phase 1 Monitoring
# ============================================================
# This file defines custom queries to collect Phase 1 specific
# metrics from the PostgreSQL database.
# ============================================================

# ============================================================
# PHASE 1 SCHEMA VALIDATION QUERIES
# ============================================================

phase1_subscription_plans_schema_valid:
  query: |
    SELECT 
      CASE WHEN EXISTS(
        SELECT 1 FROM information_schema.columns 
        WHERE table_name='subscription_plans' AND column_name='interval'
      ) THEN 1 ELSE 0 END as schema_valid
  metrics:
    - schema_valid:
        usage: "GAUGE"
        description: "Whether subscription_plans table has the required interval column"

phase1_wallet_functions_available:
  query: |
    SELECT 
      CASE WHEN (
        EXISTS(SELECT 1 FROM pg_proc WHERE proname='credit_wallet') AND
        EXISTS(SELECT 1 FROM pg_proc WHERE proname='debit_wallet')
      ) THEN 1 ELSE 0 END as functions_available
  metrics:
    - functions_available:
        usage: "GAUGE"
        description: "Whether wallet alias functions are available"

phase1_subscription_payments_table_exists:
  query: |
    SELECT 
      CASE WHEN EXISTS(
        SELECT 1 FROM information_schema.tables 
        WHERE table_name='subscription_payments'
      ) THEN 1 ELSE 0 END as table_exists
  metrics:
    - table_exists:
        usage: "GAUGE"
        description: "Whether subscription_payments table exists"

# ============================================================
# PHASE 1 PERFORMANCE METRICS
# ============================================================

phase1_subscription_plans_operations:
  query: |
    SELECT 
      component_name,
      operation_type,
      COUNT(*) as total_operations,
      COUNT(*) FILTER (WHERE success = true) as successful_operations,
      COUNT(*) FILTER (WHERE success = false) as failed_operations,
      AVG(execution_time_ms) as avg_execution_time_ms,
      MAX(execution_time_ms) as max_execution_time_ms
    FROM phase1_performance_metrics
    WHERE component_name = 'subscription_plans'
      AND created_at > NOW() - INTERVAL '5 minutes'
    GROUP BY component_name, operation_type
  metrics:
    - component_name:
        usage: "LABEL"
        description: "Phase 1 component name"
    - operation_type:
        usage: "LABEL" 
        description: "Type of operation"
    - total_operations:
        usage: "GAUGE"
        description: "Total operations in last 5 minutes"
    - successful_operations:
        usage: "GAUGE"
        description: "Successful operations in last 5 minutes"
    - failed_operations:
        usage: "GAUGE"
        description: "Failed operations in last 5 minutes"
    - avg_execution_time_ms:
        usage: "GAUGE"
        description: "Average execution time in milliseconds"
    - max_execution_time_ms:
        usage: "GAUGE"
        description: "Maximum execution time in milliseconds"

phase1_wallet_functions_operations:
  query: |
    SELECT 
      component_name,
      operation_type,
      COUNT(*) as total_operations,
      COUNT(*) FILTER (WHERE success = true) as successful_operations,
      COUNT(*) FILTER (WHERE success = false) as failed_operations,
      AVG(execution_time_ms) as avg_execution_time_ms
    FROM phase1_performance_metrics
    WHERE component_name = 'wallet_functions'
      AND created_at > NOW() - INTERVAL '5 minutes'
    GROUP BY component_name, operation_type
  metrics:
    - component_name:
        usage: "LABEL"
        description: "Phase 1 component name"
    - operation_type:
        usage: "LABEL"
        description: "Type of operation"
    - total_operations:
        usage: "GAUGE"
        description: "Total operations in last 5 minutes"
    - successful_operations:
        usage: "GAUGE"
        description: "Successful operations in last 5 minutes"
    - failed_operations:
        usage: "GAUGE"
        description: "Failed operations in last 5 minutes"
    - avg_execution_time_ms:
        usage: "GAUGE"
        description: "Average execution time in milliseconds"

phase1_subscription_payments_operations:
  query: |
    SELECT 
      component_name,
      operation_type,
      COUNT(*) as total_operations,
      COUNT(*) FILTER (WHERE success = true) as successful_operations,
      COUNT(*) FILTER (WHERE success = false) as failed_operations,
      AVG(execution_time_ms) as avg_execution_time_ms
    FROM phase1_performance_metrics
    WHERE component_name = 'subscription_payments'
      AND created_at > NOW() - INTERVAL '5 minutes'
    GROUP BY component_name, operation_type
  metrics:
    - component_name:
        usage: "LABEL"
        description: "Phase 1 component name"
    - operation_type:
        usage: "LABEL"
        description: "Type of operation"
    - total_operations:
        usage: "GAUGE"
        description: "Total operations in last 5 minutes"
    - successful_operations:
        usage: "GAUGE"
        description: "Successful operations in last 5 minutes"
    - failed_operations:
        usage: "GAUGE"
        description: "Failed operations in last 5 minutes"
    - avg_execution_time_ms:
        usage: "GAUGE"
