# ============================================================
# Phase 1 Critical Database Fixes - Monitoring Stack
# ============================================================
# Docker Compose configuration for a complete monitoring stack
# including Prometheus, Grafana, AlertManager, and custom
# Phase 1 monitoring services.
# ============================================================

version: '3.8'

services:
  # ============================================================
  # PROMETHEUS - Metrics Collection and Storage
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: phase1-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_rules.yml:/etc/prometheus/rules/phase1_rules.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.rexo.local`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # ============================================================
  # GRAFANA - Visualization and Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: phase1-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=alerts@rexo.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./phase1_grafana_dashboard.json:/var/lib/grafana/dashboards/phase1_dashboard.json
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.rexo.local`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ============================================================
  # ALERTMANAGER - Alert Routing and Notifications
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: phase1-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager.rexo.local'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.rexo.local`)"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  # ============================================================
  # POSTGRES EXPORTER - Database Metrics
  # ============================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: phase1-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=${DATABASE_URL}
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    ports:
      - "9187:9187"
    volumes:
      - ./postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============================================================
  # PHASE 1 ALERT SYSTEM - Custom Monitoring Service
  # ============================================================
  phase1-alert-system:
    build:
      context: .
      dockerfile: Dockerfile.alert-system
    container_name: phase1-alert-system
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY}
      - WEBSOCKET_PORT=8080
      - MONITOR_INTERVAL_SECONDS=30
    ports:
      - "8080:8080"
      - "9091:9091"  # Prometheus metrics endpoint
    volumes:
      - ./phase1_alert_system.js:/app/index.js
      - ./package.json:/app/package.json
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
      - grafana

  # ============================================================
  # PHASE 1 METRICS EXPORTER - Custom Metrics Collection
  # ============================================================
  phase1-metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile.metrics-exporter
    container_name: phase1-metrics-exporter
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - METRICS_PORT=9092
      - SCRAPE_INTERVAL_SECONDS=15
    ports:
      - "9092:9092"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============================================================
  # NODE EXPORTER - System Metrics
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: phase1-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================
  # CADVISOR - Container Metrics
  # ============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: phase1-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================
  # TRAEFIK - Reverse Proxy and Load Balancer
  # ============================================================
  traefik:
    image: traefik:v2.9
    container_name: phase1-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================
  # LOKI - Log Aggregation (Optional)
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: phase1-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================
  # PROMTAIL - Log Collection Agent (Optional)
  # ============================================================
  promtail:
    image: grafana/promtail:latest
    container_name: phase1-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

# ============================================================
# VOLUMES
# ============================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# CONFIGURATION NOTES
# ============================================================
#
# 1. Environment Variables Required:
#    - DATABASE_URL: PostgreSQL connection string
#    - SUPABASE_URL: Supabase project URL
#    - SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
#    - SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS: Email configuration
#    - SLACK_WEBHOOK_URL: Slack webhook for notifications
#    - PAGERDUTY_INTEGRATION_KEY: PagerDuty integration key
#
# 2. Create .env file with above variables before running
#
# 3. Create configuration files:
#    - prometheus.yml (Prometheus configuration)
#    - alertmanager.yml (AlertManager configuration)
#    - postgres_exporter_queries.yaml (Custom PostgreSQL queries)
#    - promtail-config.yml (Log collection configuration)
#
# 4. Usage Commands:
#    docker-compose -f docker-compose.monitoring.yml up -d
#    docker-compose -f docker-compose.monitoring.yml down
#    docker-compose -f docker-compose.monitoring.yml logs -f
#
# 5. Access URLs (with Traefik):
#    - Grafana: http://grafana.rexo.local (admin/admin123)
#    - Prometheus: http://prometheus.rexo.local
#    - AlertManager: http://alertmanager.rexo.local
#    - Traefik Dashboard: http://localhost:8080
#
# 6. Health Check Endpoints:
#    - Phase 1 Alert System: http://localhost:8080/health
#    - Phase 1 Metrics: http://localhost:9092/metrics
#    - PostgreSQL Metrics: http://localhost:9187/metrics
#    - Node Metrics: http://localhost:9100/metrics
# ============================================================