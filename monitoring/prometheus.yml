# ============================================================
# Prometheus Configuration for Phase 1 Monitoring
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'phase1-monitoring'
    environment: '${ENVIRONMENT:-production}'

rule_files:
  - "/etc/prometheus/rules/phase1_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL database metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 10s
    metrics_path: /metrics

  # Phase 1 custom metrics
  - job_name: 'phase1-metrics'
    static_configs:
      - targets: ['phase1-metrics-exporter:9092']
    scrape_interval: 15s
    metrics_path: /metrics

  # Phase 1 alert system metrics
  - job_name: 'phase1-alerts'
    static_configs:
      - targets: ['phase1-alert-system:9091']
    scrape_interval: 30s
    metrics_path: /metrics

  # System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # AlertManager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']