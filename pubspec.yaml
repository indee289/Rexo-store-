name: rexo_marketplace
description: Rexo Marketplace - Premium Influencer Marketing Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  go_router: ^13.0.0
  flutter_riverpod: ^2.4.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  phosphor_flutter: ^2.1.0
  intl: ^0.19.0
  image_picker: ^1.0.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  uuid: ^4.2.0
  crypto: ^3.0.0
  http: ^1.1.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^17.2.3
  qr_flutter: ^4.1.0
  # Pinned to an exact version per OneSignal integration guidance (no widened
  # ranges). 5.6.8 is the latest published stable and is verified by CI.
  onesignal_flutter: 5.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/
    - assets/icons/
